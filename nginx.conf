# /etc/nginx/sites-available/notescan
# Replace yourdomain.com with your actual domain throughout.
# After placing this file:
#   sudo ln -s /etc/nginx/sites-available/notescan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run Certbot:
#   sudo certbot --nginx -d yourdomain.com
# Certbot will modify this file to add the SSL block automatically.

server {
    listen 80;
    server_name yourdomain.com;

    # Let Certbot use this for ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com;

    # Certbot will populate these lines; leave placeholders so the config
    # is valid before you run certbot the first time by keeping the HTTP-only
    # block above active until then (comment out this block initially).
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Proxy to the Next.js container (bound to 127.0.0.1 only)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow large image uploads (30 pages * ~1 MB each)
        client_max_body_size 50M;

        # OCR streaming responses can take a while
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
